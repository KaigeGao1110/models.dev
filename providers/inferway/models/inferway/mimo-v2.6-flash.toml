# Model ID inferway/mimo-v2.6-flash, served on Inferway's own MiMo-V2.6-Flash
# deployment (not a pass-through to Xiaomi's API).
# Effort: reasoning_effort = "none" turns thinking off; every other accepted
# level (minimal|low|medium|high|xhigh|max) turns it on, and they all do the
# same thing. Unknown levels return HTTP 400. Leaving reasoning_effort out keeps
# thinking off. So this is an effort list with none, not a toggle. The same
# switch is also exposed as chat_template_kwargs.enable_thinking and
# reasoning.enabled; if these contradict reasoning_effort the request gets
# HTTP 400. thinking.type returns HTTP 400.
# Wire evidence (2026-09-24, POST https://api.inferway.ai/v1/chat/completions,
# two trials per case, streamed, usage.completion_tokens_details.reasoning_tokens):
# none 0/0, omitted 0/0, low 4/32, high 74/34, enable_thinking=true 12/30.
# Reasoning streams in reasoning_content, and reasoning_content replayed in
# history is accepted. Tool calls (streaming and non-streaming) succeed, and so
# does response_format json_schema. max_tokens 131072 is accepted. Image input
# (data: URL) succeeds; audio and video input are not served on this host.
# Limits and pricing: https://api.inferway.ai/v1/models and
# https://inferway.ai/pricing (accessed 2026-09-24): context 262,144 tokens;
# USD per 1M tokens $0.14 input / $0.28 output / $0.0028 cache hit
# (pricing_version mimo-v2.6-flash-usd-2026-09-23). These are list prices; a
# time-limited launch promotion is not recorded here.
base_model = "xiaomi/mimo-v2.6-flash"
structured_output = true
reasoning_options = [{ type = "effort", values = ["none", "high"] }]

[cost]
input = 0.14
output = 0.28
cache_read = 0.0028

[limit]
context = 262_144

[modalities]
input = ["text", "image"]

[interleaved]
field = "reasoning_content"
