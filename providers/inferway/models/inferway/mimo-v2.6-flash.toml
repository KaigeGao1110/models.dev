# Model ID inferway/mimo-v2.6-flash, served on Inferway's own MiMo-V2.6-Flash
# deployment (not a pass-through to Xiaomi's API).
# Toggle: chat_template_kwargs.enable_thinking = true|false (reasoning.enabled =
# true|false is accepted as an alias). Thinking is off by default. The host
# rejects thinking.type with HTTP 400 and accepts reasoning_effort without any
# effect, so no effort values are declared.
# Wire evidence (2026-09-24, POST https://api.inferway.ai/v1/chat/completions):
# enable_thinking=true streams reasoning in reasoning_content and replayed
# reasoning_content in history is accepted; tool calls (streaming and
# non-streaming) and response_format json_schema succeed; max_tokens 131072 is
# accepted; image input is refused (production_image_input_disabled), so input
# is text-only.
# Limits and pricing: https://api.inferway.ai/v1/models and
# https://inferway.ai/pricing (accessed 2026-09-24): context 262,144 tokens;
# USD per 1M tokens $0.14 input / $0.28 output / $0.0028 cache hit
# (pricing_version mimo-v2.6-flash-usd-2026-09-23). These are list prices; a
# launch-month promotion that ends 2026-10-01 is not recorded here.
base_model = "xiaomi/mimo-v2.6-flash"
attachment = false
structured_output = true
reasoning_options = [{ type = "toggle" }]

[cost]
input = 0.14
output = 0.28
cache_read = 0.0028

[limit]
context = 262_144

[modalities]
input = ["text"]

[interleaved]
field = "reasoning_content"
